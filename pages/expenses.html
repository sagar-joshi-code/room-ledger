<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>All Expenses - RoomLedger</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100">

  <!-- HEADER -->
  <div class="max-w-6xl mx-auto px-6 py-8">

    <h1 class="text-3xl md:text-4xl font-bold text-slate-800">
      📜 All Expenses
    </h1>

    <p class="text-slate-500 mt-1">
      Complete history of your room expenses
    </p>

  </div>

  <!-- SEARCH BAR (future ready) -->
  <div class="max-w-6xl mx-auto px-6">

    <input
      type="text"
      placeholder="Search expenses..."
      class="w-full p-3 border rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
    />

  </div>

  <!-- EXPENSE LIST -->
  <div class="max-w-6xl mx-auto px-6 mt-6 space-y-8">

    <!-- DATE GROUP -->
    <div>

      <h2 class="text-xl font-bold text-slate-700 mb-3">
        📅 २० असार २०८३
      </h2>

      <div class="space-y-3">

        <!-- Expense Card -->
        <div class="bg-white p-4 rounded-2xl shadow flex justify-between items-start">

          <div>
            <h3 class="font-semibold">🍛 Lunch</h3>
            <p class="text-sm text-slate-500">Food</p>
            <p class="text-sm text-slate-500">Paid by Sagar</p>
          </div>

          <div class="text-right">
            <p class="font-bold text-red-500">Rs. 450</p>
            <button class="text-sm text-red-500 hover:text-red-700 mt-2">
              Delete
            </button>
          </div>

        </div>

        <!-- Expense Card -->
        <div class="bg-white p-4 rounded-2xl shadow flex justify-between items-start">

          <div>
            <h3 class="font-semibold">🥛 Milk</h3>
            <p class="text-sm text-slate-500">Food</p>
            <p class="text-sm text-slate-500">Paid by Anup</p>
          </div>

          <div class="text-right">
            <p class="font-bold text-red-500">Rs. 120</p>
            <button class="text-sm text-red-500 hover:text-red-700 mt-2">
              Delete
            </button>
          </div>

        </div>

      </div>

    </div>

    <!-- SECOND DATE GROUP -->
    <div>

      <h2 class="text-xl font-bold text-slate-700 mb-3">
        📅 १९ असार २०८३
      </h2>

      <div class="space-y-3">

        <div class="bg-white p-4 rounded-2xl shadow flex justify-between items-start">

          <div>
            <h3 class="font-semibold">🛢 Gas</h3>
            <p class="text-sm text-slate-500">Utilities</p>
            <p class="text-sm text-slate-500">Paid by Binod</p>
          </div>

          <div class="text-right">
            <p class="font-bold text-red-500">Rs. 1200</p>
            <button class="text-sm text-red-500 hover:text-red-700 mt-2">
              Delete
            </button>
          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- BACK BUTTON -->
  <div class="max-w-6xl mx-auto px-6 mt-10 mb-10">

    <a href="dashboard.html"
       class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold transition">

      ← Back to Dashboard

    </a>

  </div>
<script type="module" src="./js/expenses.js"></script>
</body>
</html>
