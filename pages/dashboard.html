<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - RoomLedger</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100"
  >
    <!-- HEADER -->
    <div class="max-w-6xl mx-auto px-6 py-8">
      <div class="flex justify-between items-start">
        <div>
          <h1
            id="roomName"
            class="text-3xl md:text-4xl font-bold text-slate-800"
          ></h1>

          <p class="text-slate-500 mt-1">Manage your room expenses</p>

          <div class="flex gap-4 mt-2 text-sm text-slate-600">
            <span id="roomMember"></span>
            <span id="showDate"></span>
          </div>
        </div>

        <button
          class="text-slate-600 hover:text-slate-900 text-xl bg-blue-600 py-3 px-6 text-white rounded-2xl font-bold"
        >
          Create New Room
        </button>
      </div>
    </div>

    <!-- STATS -->
    <div
      class="max-w-6xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"
    >
      <div class="bg-white p-5 rounded-2xl shadow">
        <p class="text-slate-500">Budget</p>
        <h2 id="roomBudget" class="text-2xl font-bold text-blue-600"></h2>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow">
        <p class="text-slate-500">Spent</p>
        <h2 id="totalSpent" class="text-2xl font-bold text-red-600">Rs 0</h2>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow">
        <p class="text-slate-500">Remaining</p>
        <h2 id="remainingBudget" class="text-2xl font-bold text-green-600">
          Rs 0
        </h2>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow">
        <p class="text-slate-500">Usage</p>
        <h2 id="budgetUsage" class="text-2xl font-bold text-purple-600">0%</h2>
      </div>
    </div>

    <!-- PROGRESS -->
    <div class="max-w-6xl mx-auto px-6 mt-6">
      <div class="bg-white p-6 rounded-2xl shadow">
        <div class="flex justify-between mb-2">
          <p class="font-semibold text-slate-700">Budget Progress</p>
          <p id="progressText" class="font-semibold text-slate-700">0%</p>
        </div>

        <div class="w-full bg-slate-200 rounded-full h-3">
          <div
            id="progressBar"
            class="bg-green-500 h-3 rounded-full transition-all duration-500"
          ></div>
        </div>

        <p id="budgetStatus" class="mt-3 text-green-600 font-semibold">
          ✅ Within Budget
        </p>
      </div>
    </div>

    <!-- ADD EXPENSE -->
    <div class="max-w-6xl mx-auto px-6 mt-6">
      <div class="bg-white p-6 rounded-2xl shadow">
        <h2 class="text-2xl font-bold mb-4">➕ Add Expense</h2>

        <div class="grid md:grid-cols-2 gap-4">
          <input
            id="expenseTitle"
            class="border p-3 rounded-xl"
            placeholder="Expense Title"
          />
          <input
            id="expenseAmount"
            class="border p-3 rounded-xl"
            placeholder="Amount"
            type="number"
          />

          <select id="expensePaidBy" class="border p-3 rounded-xl">
            <option value="">Select Member</option>
          </select>

          <select id="expenseCategory" class="border p-3 rounded-xl">
            <option value="">Category</option>
            <option>Food</option>
            <option>Rent</option>
            <option>Gas</option>
            <option>Other</option>
          </select>
        </div>

        <button
          id="addExpenseBtn"
          class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold transition"
        >
          Add Expense
        </button>
      </div>
    </div>

    <!-- TODAY'S EXPENSES -->
    <div class="max-w-6xl mx-auto px-6 mt-6 mb-10">
      <h2 class="text-2xl font-bold mb-4">📅 Today's Expenses</h2>

      <div id="expenseList" class="space-y-4"></div>

      <div class="text-center mt-6">
        <a href="#" class="text-blue-600 font-semibold hover:underline">
          View All Expenses →
        </a>
      </div>
    </div>
    <script type="module" src="../js/dashboard.js"></script>
  </body>
</html>
